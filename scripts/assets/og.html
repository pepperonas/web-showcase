<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('../../public/fonts/bricolage-grotesque-latin-opsz.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Instrument Sans'; src: url('../../public/fonts/instrument-sans-latin-wght.woff2') format('woff2'); font-weight: 400 700; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    background: #f4f1ea; color: #15171c;
    font-family: 'Instrument Sans', sans-serif;
    background-image:
      linear-gradient(to right, rgb(21 23 28 / .06) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(21 23 28 / .06) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: absolute; inset: 64px 72px; display: grid; grid-template-columns: 1fr 350px; gap: 48px; }
  .left { display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 44px; letter-spacing: -0.04em; }
  .brand svg { width: 52px; height: 52px; }
  h1 { font-family: 'Bricolage Grotesque'; font-weight: 680; font-size: 58px; line-height: 1; letter-spacing: -0.035em; font-variation-settings: 'opsz' 96; }
  h1 span { display: block; }
  h1 .a { color: #b03a16; }
  .claim { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #51565f; }
  .claim::before { content: ''; width: 14px; height: 14px; background: #e4572e; }
  .card { align-self: center; background: #15171c; color: #eeebe3; border-radius: 18px; padding: 30px 30px 26px; box-shadow: 0 40px 70px -40px rgb(0 0 0 / .6); }
  .card p.t { font-size: 15px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #a9adb5; margin-bottom: 16px; }
  .row { display: grid; grid-template-columns: 118px 1fr; padding: 12px 0; border-top: 1px solid #3a3e47; font-size: 20px; }
  .row span:first-child { color: #a9adb5; }
  .row span:last-child { font-weight: 600; }
  .row.n span:last-child { color: #ff8a63; }
  .ok { display: flex; gap: 10px; align-items: center; margin-top: 16px; color: #8fd9b3; font-weight: 600; font-size: 18px; }
  .corner { position: absolute; width: 22px; height: 22px; border: 0 solid #a39c8d; }
  .c1 { top: 36px; left: 40px; border-width: 1.5px 0 0 1.5px; }
  .c2 { bottom: 36px; right: 40px; border-width: 0 1.5px 1.5px 0; }
</style>
</head>
<body>
  <i class="corner c1"></i><i class="corner c2"></i>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#15171c"/><path d="M20.75 11.18A7.5 7.5 0 1 0 20.75 20.82" fill="none" stroke="#f4f1ea" stroke-width="4.2"/><rect x="20.4" y="13.9" width="4.2" height="4.2" fill="#e4572e"/></svg>
        celox
      </div>
      <h1><span>Ein starker Auftritt.</span><span>Einfachere Abläufe.</span><span class="a">Mehr Zeit fürs Geschäft.</span></h1>
      <p class="claim">Software. Sicherheit. Automatisierung.</p>
    </div>
    <div class="card">
      <p class="t">Neue Anfrage · strukturiert</p>
      <div class="row"><span>Anliegen</span><span>Badsanierung</span></div>
      <div class="row"><span>Zeitraum</span><span>In 1–3 Monaten</span></div>
      <div class="row"><span>Unterlagen</span><span>2 Fotos</span></div>
      <div class="row"><span>Zuständig</span><span>Team Bad</span></div>
      <div class="row n"><span>Nächstes</span><span>Aufmaß-Termin</span></div>
      <p class="ok">✓ Vollständig – ohne Rückfrage</p>
    </div>
  </div>
</body>
</html>
